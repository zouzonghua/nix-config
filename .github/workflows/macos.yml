name: macOS bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [work, personal]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and activate
        env:
          PROFILE: ${{ matrix.profile }}
          NIX_INSTALLER_NO_CONFIRM: "true"
        run: |
          if command -v nix >/dev/null || [[ -d /nix/store ]]; then
            echo "::error::Runner already has Nix installed"
            exit 1
          fi
          ./bootstrap.sh "$PROFILE"
      - name: Verify a fresh login shell
        run: |
          env -u __NIX_DARWIN_SET_ENVIRONMENT_DONE -u __ETC_ZSHENV_SOURCED \
            /bin/zsh -lc '
              set -e
              [[ $(command -v darwin-version) == /run/current-system/sw/bin/darwin-version ]]
              [[ $(command -v nix) == /run/current-system/sw/bin/nix ]]
              darwin-version
              nix --version
            '
          git diff --exit-code -- flake.lock
